name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test -- --watch=false
      - name: Build for GitHub Pages
        run: npm run build -- --configuration production --base-href /codequest-game/
      - name: Verify Pages artifact
        run: |
          test -s dist/codequest-game/browser/index.html
          grep -q '<base href="/codequest-game/">' dist/codequest-game/browser/index.html
          grep -q '<app-root>' dist/codequest-game/browser/index.html
          grep -R -q 'Oi! Eu sou o Byte.' dist/codequest-game/browser/*.js
          test -s dist/codequest-game/browser/codequest.svg
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/codequest-game/browser
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
